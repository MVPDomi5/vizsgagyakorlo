<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ápolási Vizsgagyakorló</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: egyoszlopos, telefonra szabott app; ragadós felső sáv + alsó akciósáv. Anatómia = vér-bordó, Betegmegfigyelés = kórlap-petrol. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e3e8ed; --ink:#15202b; --muted:#5a6876; --line:#d4dbe2;
  --ana:#9e2236; --ana-soft:#f6e3e6; --bm:#0d6b72; --bm-soft:#dcf0f1;
  --ok:#1b7a4b; --ok-soft:#dff3e8; --bad:#bd3326; --bad-soft:#fbe5e2; --warn:#a86700; --warn-soft:#fbefd9;
  --acc:var(--ink); --acc-soft:var(--sunk);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Source Sans 3", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1419; --surface:#172029; --sunk:#202b36; --ink:#e7edf2; --muted:#93a2b0; --line:#2b3845;
  --ana:#ec7186; --ana-soft:#3a1d24; --bm:#4cc0c6; --bm-soft:#123236;
  --ok:#4ccb8a; --ok-soft:#14301f; --bad:#f2786b; --bad-soft:#3a1c19; --warn:#f0b351; --warn-soft:#352812; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#172029; --sunk:#202b36; --ink:#e7edf2; --muted:#93a2b0; --line:#2b3845;
  --ana:#ec7186; --ana-soft:#3a1d24; --bm:#4cc0c6; --bm-soft:#123236;
  --ok:#4ccb8a; --ok-soft:#14301f; --bad:#f2786b; --bad-soft:#3a1c19; --warn:#f0b351; --warn-soft:#352812; color-scheme:dark;}
body[data-subj="ana"]{--acc:var(--ana);--acc-soft:var(--ana-soft)}
body[data-subj="bm"]{--acc:var(--bm);--acc-soft:var(--bm-soft)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 140px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* --- Kezdőlap --- */
.hero{padding-block:22px 6px;display:grid;gap:6px}
.hero h1{font-size:clamp(30px,8vw,42px);font-weight:800;line-height:1.02}
.hero p{margin:0;color:var(--muted);max-width:34ch}
.subjects{display:grid;gap:14px;margin-top:20px}
.subj{position:relative;display:grid;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:18px 18px 16px;overflow:hidden}
.subj .tag{display:inline-flex;align-items:center;gap:8px}
.subj .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.subj h2{font-size:28px;font-weight:800;color:var(--c)}
.subj .desc{margin:0;color:var(--muted);font-size:15.5px}
.subj .meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--muted)}
.subj .meta b{color:var(--ink);font-weight:700}
.subj svg.trace{position:absolute;right:-6px;top:4px;width:130px;height:48px;opacity:.35;pointer-events:none}
.subj[data-s="ana"]{--c:var(--ana)} .subj[data-s="bm"]{--c:var(--bm)}
.subj .go{justify-self:start;margin-top:4px;background:var(--c);color:var(--surface);border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px}
.foot{margin-top:24px;font-size:13.5px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13.5px}

/* --- Beállítás --- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;margin-inline:-4px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.topbar .t{flex:1;min-width:0}
.topbar .t b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.1;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.stack{display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-size:15.5px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.chip small{font-family:var(--f-mono);font-weight:500;color:var(--muted);margin-left:4px;font-size:12px}
.info{font-size:14.5px;color:var(--muted);margin:0}

/* --- Kérdés --- */
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .25s}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.qtype{display:inline-block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);background:var(--acc-soft);border-radius:6px;padding:3px 8px}
.qtext{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.25;margin:10px 0 4px}
.hint{font-size:14px;color:var(--muted);margin:0 0 6px}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-size:16.5px;min-height:52px}
.opt .mk{flex:none;width:24px;height:24px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;margin-top:1px;font-size:14px;font-weight:700}
.opt.sq .mk{border-radius:6px}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.opt[aria-pressed="true"] .mk{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.opt span.tx{min-width:0}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tfrow .opt{justify-content:center;font-weight:700;font-size:18px}
.rows{display:grid;gap:10px;margin-top:10px}
.mrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.mrow .l{font-weight:700}
select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
select.set{border-color:var(--acc)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 0;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 6px;font-size:14.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.ordpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ordpick button{border:1.5px dashed var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15.5px;text-align:left}
.ordpick button:disabled{opacity:.3;cursor:default}
.ordlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;counter-reset:o}
.ordlist li{display:flex;align-items:center;gap:10px;background:var(--acc-soft);border:1.5px solid var(--acc);border-radius:10px;padding:10px 12px;counter-increment:o}
.ordlist li::before{content:counter(o);font-family:var(--f-mono);font-weight:700;color:var(--acc);width:20px}
.ordlist li .tx{flex:1;min-width:0}
.ordlist li button{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}
.ordempty{border:1.5px dashed var(--line);border-radius:10px;padding:12px;color:var(--muted);font-size:14.5px;text-align:center}

/* --- Alsó sáv --- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 16px;font-weight:700;font-size:16.5px;min-height:50px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--surface);flex:1}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.dots button{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:12px;padding:0}
.dots button.done{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.dots button.cur{outline:2px solid var(--ink);outline-offset:1px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px}

/* --- Eredmény --- */
.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.ring{width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1}
.grade{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.1}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14.5px;color:var(--muted);margin-top:6px}
.kv b{color:var(--ink)}
.scale{display:flex;gap:4px;margin-top:10px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.scale span{flex:1;text-align:center;border-top:4px solid var(--sunk);padding-top:3px}
.scale span.on{border-color:var(--acc);color:var(--ink);font-weight:700}
.topics{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:15px}
.trow .bar2{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.trow .bar2 i{display:block;height:100%;background:var(--acc)}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;border-left:5px solid var(--st)}
.rv.ok{--st:var(--ok)} .rv.part{--st:var(--warn)} .rv.bad{--st:var(--bad)}
.rv .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rv .q{font-weight:700;font-size:16.5px;line-height:1.3}
.badge{font-family:var(--f-mono);font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap;color:var(--st);background:color-mix(in srgb,var(--st) 14%,transparent)}
.ans{display:grid;gap:6px;font-size:15px}
.a{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:9px;background:var(--bg)}
.a .ic{flex:none;width:20px;font-weight:800;text-align:center}
.a.good{background:var(--ok-soft);color:var(--ok)} .a.good .tx{color:var(--ink)}
.a.wrong{background:var(--bad-soft);color:var(--bad)} .a.wrong .tx{color:var(--ink)}
.a.miss{border:1.5px dashed var(--ok);color:var(--ok)} .a.miss .tx{color:var(--ink)}
.a .tx{min-width:0}
.a small{display:block;color:var(--muted);font-size:13px}
.exp{font-size:14.5px;background:var(--acc-soft);border-radius:9px;padding:9px 11px}
.exp b{color:var(--acc)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.hist{display:grid;gap:6px;font-size:14.5px}
.hist div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-block:6px}
figure.fig{margin:10px 0 4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;justify-content:center}
figure.fig img{max-height:34vh;width:auto;max-width:100%;object-fit:contain;border-radius:6px}
figure.fig.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:5;box-shadow:0 6px 16px -10px rgba(0,0,0,.35)}
figure.fig.sticky img{max-height:36vh}
.rv figure.fig img{max-height:40vh}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px}
.tile b{font-size:22px;font-weight:700}
.tbl{overflow-x:auto;margin-inline:-4px}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
.tbl th{text-align:left;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line)}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function FIG(tp,q,img,labels,n,e){return{t:'ma',tp,q,img,ordered:true,allChoices:true,pairs:labels.map(([k,v])=>[k+'.',v]),n,e}}
function figSingles(tp,img,labels,what){
  return labels.map(([k,v])=>{const others=shuffle(labels.filter(x=>x[1]!==v).map(x=>x[1])).slice(0,3);
    return Object.assign(S(tp,`Ábra (${what}) – mit jelöl a ${k}. szám?`,[v,...others],`A ${k}. számmal jelölt képlet: ${v}.`),{img})});
}

function makeInst(tpl){
  const I={id:tpl.id,t:tpl.t,tp:tpl.tp,q:tpl.q,e:tpl.e,img:tpl.img||null};
  if(tpl.t==='s'){I.opts=shuffle(tpl.o.map((x,i)=>({x,c:i===0})));I.ans=null;I.max=1}
  else if(tpl.t==='m'){I.opts=shuffle([...tpl.good.map(x=>({x,c:true})),...tpl.bad.map(x=>({x,c:false}))]);I.ans=[];I.max=tpl.good.length}
  else if(tpl.t==='tf'){I.a=tpl.a;I.ans=null;I.max=1}
  else if(tpl.t==='ma'){
    const used=new Set();let pick=[];
    for(const p of shuffle(tpl.pairs)){if(pick.length>=tpl.n)break;if(used.has(p[1]))continue;used.add(p[1]);pick.push(p)}
    if(tpl.ordered)pick.sort((a,b)=>tpl.pairs.indexOf(a)-tpl.pairs.indexOf(b));
    const rest=tpl.pairs.filter(p=>!used.has(p[1])).map(p=>p[1]).filter((v,i,a)=>a.indexOf(v)===i);
    const extra=tpl.allChoices?rest:shuffle(rest).slice(0,1);
    I.rows=pick.map(p=>({l:p[0],r:p[1]}));I.choices=shuffle([...pick.map(p=>p[1]),...extra]);I.ans=I.rows.map(()=>'');I.max=I.rows.length}
  else if(tpl.t==='ord'){
    let sh;do{sh=shuffle(tpl.items)}while(sh.join('|')===tpl.items.join('|')&&tpl.items.length>1);
    I.items=tpl.items.slice();I.shown=sh;I.ans=[];I.max=tpl.items.length}
  else if(tpl.t==='c'){
    let pick=shuffle(tpl.items).slice(0,Math.min(tpl.n,tpl.items.length));
    tpl.groups.forEach((g,gi)=>{if(!pick.some(x=>x[1]===gi)){const cand=tpl.items.find(x=>x[1]===gi&&!pick.includes(x));if(cand){const k=pick.findIndex(x=>pick.filter(y=>y[1]===x[1]).length>1);if(k>=0)pick[k]=cand}}});
    I.groups=tpl.groups;I.items=shuffle(pick).map(x=>({x:x[0],g:x[1]}));I.ans=I.items.map(()=>null);I.max=I.items.length}
  return I;
}
function scoreOf(I){
  switch(I.t){
    case's':return I.ans!=null&&I.opts[I.ans].c?1:0;
    case'm':{let h=0,w=0;I.ans.forEach(i=>I.opts[i].c?h++:w++);return Math.max(0,h-w)}
    case'tf':return I.ans!=null&&I.ans===I.a?1:0;
    case'ma':return I.rows.reduce((s,r,i)=>s+(I.ans[i]===r.r?1:0),0);
    case'ord':return I.items.reduce((s,x,i)=>s+(I.shown[I.ans[i]]===x?1:0),0);
    case'c':return I.items.reduce((s,x,i)=>s+(I.ans[i]===x.g?1:0),0);
  }
}
function touched(I){
  if(I.t==='s'||I.t==='tf')return I.ans!=null;
  if(I.t==='m'||I.t==='ord')return I.ans.length>0;
  if(I.t==='ma')return I.ans.some(Boolean);
  if(I.t==='c')return I.ans.some(v=>v!=null);
}
function complete(I){
  if(I.t==='ma')return I.ans.every(Boolean);
  if(I.t==='ord')return I.ans.length===I.items.length;
  if(I.t==='c')return I.ans.every(v=>v!=null);
  return touched(I);
}

let statSubj='all', view='home', cfg={subj:'ana',len:20,topics:null}, EX=load('vg-cur',null), confirmSubmit=false, confirmReset=false, rvFilter='bad';
const saveEx=()=>save('vg-cur',EX);

function pickQuestions(subj,topics,n,fromIds){
  const bank=SUBJ[subj].bank;
  if(fromIds)return shuffle(bank.filter(q=>fromIds.includes(q.id)));
  const pool=bank.filter(q=>!topics||topics.includes(q.tp));
  const seen=new Set(STORE.seen[subj]);
  const fresh=shuffle(pool.filter(q=>!seen.has(q.id))), old=shuffle(pool.filter(q=>seen.has(q.id)));
  const take=n==='all'?pool.length:Math.min(n,pool.length);
  return [...fresh,...old].slice(0,take);
}
function startExam(fromIds){
  const qs=pickQuestions(cfg.subj,cfg.topics,cfg.len,fromIds);
  EX={subj:cfg.subj,cfg:{...cfg},items:qs.map(makeInst),cur:0,start:Date.now(),done:false,retry:!!fromIds};
  confirmSubmit=false;saveEx();view='quiz';render(true);
}
function submitExam(){
  EX.done=true;EX.end=Date.now();
  const pts=EX.items.reduce((s,I)=>s+scoreOf(I),0),max=EX.items.reduce((s,I)=>s+I.max,0);
  EX.pts=pts;EX.max=max;EX.pct=max?Math.round(pts/max*1000)/10:0;
  const subj=EX.subj, seen=new Set(STORE.seen[subj]);EX.items.forEach(I=>seen.add(I.id));
  if(seen.size>=SUBJ[subj].bank.length){STORE.seen[subj]=EX.items.map(I=>I.id)}else STORE.seen[subj]=[...seen];
  const tps={};EX.items.forEach(I=>{const t=tps[I.tp]||(tps[I.tp]=[0,0]);t[0]+=scoreOf(I);t[1]+=I.max});
  STORE.hist[subj].unshift({d:EX.end,pct:EX.pct,pts,max,n:EX.items.length,sec:Math.round((EX.end-EX.start)/1000),tps,retry:!!EX.retry,nok:EX.items.filter(I=>scoreOf(I)===I.max).length});
  STORE.hist[subj]=STORE.hist[subj].slice(0,500);persist();
  rvFilter=EX.items.some(I=>scoreOf(I)<I.max)?'bad':'all';
  saveEx();view='result';render(true);
}

    <div class="ordpick">${I.shown.map((x,ix)=>`<button data-act="ordadd" data-ix="${ix}" ${I.ans.includes(ix)?'disabled':''}>${esc(x)}</button>`).join('')}</div>`;
  }else if(I.t==='c'){
    h=`<div class="rows">${I.items.map((it,i)=>`<div class="mrow"><span class="l">${esc(it.x)}</span><div class="seg">${I.groups.map((g,gi)=>`<button data-act="cls" data-i="${i}" data-g="${gi}" aria-pressed="${I.ans[i]===gi}">${esc(g)}</button>`).join('')}</div></div>`).join('')}</div>`;
  }
  return h;
}
function quizView(){
  const S=SUBJ[EX.subj];document.body.dataset.subj=EX.subj;
  const I=EX.items[EX.cur],n=EX.items.length,ans=EX.items.filter(touched).length;
  const last=EX.cur===n-1, missing=n-EX.items.filter(complete).length;
  return `<div class="wrap">
    <div class="topbar"><button class="back" data-act="home" aria-label="Kilépés">←</button><div class="t"><span class="eyebrow">${S.short}${EX.retry?' · hibák újra':''}</span><b class="num">${EX.cur+1} / ${n}</b></div><span class="eyebrow num" id="clock">${fmtTime(Math.round((Date.now()-EX.start)/1000))}</span></div>
    <div class="prog"><i style="width:${ans/n*100}%"></i></div>
    <div class="qhead"><span class="qtype">${TYPE[I.t]}</span><span class="eyebrow">${I.max} pont</span></div>
    <h2 class="qtext">${esc(I.q)}</h2>
    <p class="hint">${I.img&&I.t==='ma'?'Minden számhoz válassza ki a képlet nevét.':HINT[I.t]}</p>
    ${figHTML(I,I.t==='ma')}
    ${qBody(I,EX.cur)}
    <div class="dots" aria-label="Kérdések">${EX.items.map((x,i)=>`<button class="${touched(x)?'done':''} ${i===EX.cur?'cur':''}" data-act="goto" data-i="${i}">${i+1}</button>`).join('')}</div>
    ${confirmSubmit?`<div class="warnbox" style="margin-top:14px">${missing?`${missing} kérdés hiányos vagy megválaszolatlan. Ezek 0 pontot érnek.`:'Minden kérdésre válaszoltál.'} Biztosan beadod?</div>`:''}
  </div>
  <div class="bar"><div class="in">
    <button class="btn" data-act="prev" ${EX.cur===0?'disabled':''} aria-label="Előző">←</button>
    ${confirmSubmit?`<button class="btn ghost" data-act="cancelsub">Mégse</button><button class="btn pri" data-act="submit2">Igen, beadom</button>`:
      last?`<button class="btn pri" data-act="submit">Beadás és javítás</button>`:`<button class="btn pri" data-act="next">Következő</button><button class="btn ghost" data-act="submit">Beadás</button>`}
  </div></div>`;
}
function reviewItem(I,qi){
  const sc=scoreOf(I),cls=sc===I.max?'ok':sc>0?'part':'bad';
  let a='';
  const line=(k,ic,tx,sub)=>`<div class="a ${k}"><span class="ic">${ic}</span><span class="tx">${esc(tx)}${sub?`<small>${sub}</small>`:''}</span></div>`;
  if(I.t==='s'||I.t==='m'){
    a=I.opts.map((o,i)=>{const ch=I.t==='s'?I.ans===i:I.ans.includes(i);
      if(o.c&&ch)return line('good','✓',o.x,'A te válaszod – helyes');
      if(o.c&&!ch)return line('miss','✓',o.x,'Helyes válasz – nem jelölted');
      if(!o.c&&ch)return line('wrong','✗',o.x,'A te válaszod – hibás');
      return line('','',o.x)}).join('');
  }else if(I.t==='tf'){
    const L=v=>v?'Igaz':'Hamis';
    a=I.ans==null?line('wrong','–','Nem válaszoltál')+line('miss','✓','Helyes: '+L(I.a)):I.ans===I.a?line('good','✓','A te válaszod: '+L(I.ans),'Helyes'):line('wrong','✗','A te válaszod: '+L(I.ans))+line('miss','✓','Helyes: '+L(I.a));
  }else if(I.t==='ma'){
    a=I.rows.map((r,i)=>I.ans[i]===r.r?line('good','✓',r.l+' → '+r.r):line('wrong','✗',r.l+' → '+(I.ans[i]||'nincs megadva'),'Helyes: '+esc(r.r))).join('');
  }else if(I.t==='ord'){
    a=I.items.map((x,p)=>{const y=I.ans[p]!=null?I.shown[I.ans[p]]:null;return y===x?line('good',p+1+'.',x):line('wrong',p+1+'.',y||'nincs megadva','Helyes: '+esc(x))}).join('');
  }else if(I.t==='c'){
    a=I.items.map((it,i)=>I.ans[i]===it.g?line('good','✓',it.x+' → '+I.groups[it.g]):line('wrong','✗',it.x+' → '+(I.ans[i]!=null?I.groups[I.ans[i]]:'nincs megadva'),'Helyes: '+esc(I.groups[it.g]))).join('');
  }
  return `<article class="rv ${cls}"><div class="h"><span class="eyebrow">${qi+1}. · ${TYPE[I.t]}</span><span class="badge num">${sc}/${I.max} p</span></div><div class="q">${esc(I.q)}</div>${figHTML(I,false)}<div class="ans">${a}</div>${I.e?`<div class="exp"><b>Magyarázat:</b> ${esc(I.e)}</div>`:''}</article>`;
}
function resultView(){
  const S=SUBJ[EX.subj];document.body.dataset.subj=EX.subj;
  const p=EX.pct,g=gradeOf(p),C=2*Math.PI*52;
  const sec=Math.round((EX.end-EX.start)/1000);
  const byTp={};EX.items.forEach(I=>{const t=byTp[I.tp]||(byTp[I.tp]={p:0,m:0});t.p+=scoreOf(I);t.m+=I.max});
  const nOk=EX.items.filter(I=>scoreOf(I)===I.max).length,nBad=EX.items.length-nOk;
  const list=EX.items.map((I,i)=>({I,i})).filter(({I})=>rvFilter==='all'||(rvFilter==='bad'?scoreOf(I)<I.max:scoreOf(I)===I.max));
  const gi=GRADES.findIndex(x=>p>=x[0]);
  return `<div class="wrap">
    <div class="topbar"><button class="back" data-act="home" aria-label="Főoldal">←</button><div class="t"><span class="eyebrow">Javítólap</span><b>${S.name}</b></div></div>
    <div class="stack">
      <section class="score">
        <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--sunk)" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}"/></svg><div class="v"><div><b class="num">${Math.round(p)}%</b></div></div></div>
        <div style="min-width:0"><span class="eyebrow">Eredmény</span><div class="grade">${g}</div>
          <div class="kv"><span><b class="num">${EX.pts}</b> / <span class="num">${EX.max}</span> pont</span><span><b class="num">${nOk}</b> hibátlan</span><span><b class="num">${nBad}</b> hibás/részleges</span><span>idő: <b class="num">${fmtTime(sec)}</b></span></div>
          <div class="scale">${GRADES.slice().reverse().map((x,i)=>`<span class="${GRADES.length-1-i===gi?'on':''}">${x[1].match(/\d/)[0]}</span>`).join('')}</div>
        </div>
      </section>
      <section class="panel"><span class="eyebrow">Témakörönként</span><div class="topics">${Object.entries(byTp).map(([t,v])=>`<div class="trow"><span>${S.topics[t]}</span><span class="num">${v.p}/${v.m} · ${Math.round(v.p/v.m*100)}%</span><div class="bar2"><i style="width:${v.p/v.m*100}%"></i></div></div>`).join('')}</div></section>
      <div class="filters">${[['bad','Hibás és részleges ('+nBad+')'],['ok','Hibátlan ('+nOk+')'],['all','Összes ('+EX.items.length+')']].map(([k,l])=>`<button class="chip" data-act="filter" data-f="${k}" aria-pressed="${rvFilter===k}">${l}</button>`).join('')}</div>
      ${list.length?list.map(({I,i})=>reviewItem(I,i)).join(''):`<p class="info">Ebben a nézetben nincs kérdés.</p>`}
    </div>
  </div>
  <div class="bar"><div class="in">
    ${nBad?`<button class="btn" data-act="retry">Hibásak újra</button>`:''}
    <button class="btn pri" data-act="again">Új vizsga</button>
  </div></div>`;
}


function statsView(){
  document.body.dataset.subj=statSubj==='all'?'':statSubj;
  const keys=statSubj==='all'?['ana','bm']:[statSubj];
  const rows=keys.flatMap(k=>STORE.hist[k].map(h=>({...h,k}))).sort((a,b)=>b.d-a.d);
  const n=rows.length, avg=n?Math.round(rows.reduce((s,r)=>s+r.pct,0)/n*10)/10:0, best=n?Math.max(...rows.map(r=>r.pct)):0;
  const totSec=rows.reduce((s,r)=>s+(r.sec||0),0), totQ=rows.reduce((s,r)=>s+r.n,0);
  const pass=rows.filter(r=>r.pct>=41).length;
  const dt=d=>new Date(d).toLocaleString('hu-HU',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  // trend
  const ch=rows.slice().reverse().slice(-30);let chart='';
  if(ch.length>=2){const W=320,H=140,px=28,py=10,x=i=>px+i*(W-px-8)/(ch.length-1),y=v=>py+(100-v)*(H-2*py)/100;
    const col=r=>`var(--${r.k})`;
    chart=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Eredmények alakulása">
    ${[41,56,71,86].map(v=>`<line x1="${px}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${px-4}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="JetBrains Mono,monospace">${v}</text>`).join('')}
    <polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${ch.map((r,i)=>x(i)+','+y(r.pct)).join(' ')}"/>
    ${ch.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.pct)}" r="${i===ch.length-1?4.5:3}" fill="${col(r)}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}</svg>
    <p class="info">Az utolsó ${ch.length} kitöltés, időrendben. A szaggatott vonalak a jegyhatárok (41, 56, 71, 86%).</p>`;}
  // témakörök
  const agg={};keys.forEach(k=>STORE.hist[k].forEach(h=>{for(const t in (h.tps||{})){const a=agg[k+'|'+t]||(agg[k+'|'+t]={k,t,p:0,m:0});a.p+=h.tps[t][0];a.m+=h.tps[t][1]}}));
  const tlist=Object.values(agg).sort((a,b)=>a.p/a.m-b.p/b.m);
  const gcount={};rows.forEach(r=>{const g=gradeOf(r.pct);gcount[g]=(gcount[g]||0)+1});
  const tile=(l,v)=>`<div class="tile"><span class="eyebrow">${l}</span><b class="num">${v}</b></div>`;
  return `<div class="wrap">
    <div class="topbar"><button class="back" data-act="home" aria-label="Vissza">←</button><div class="t"><span class="eyebrow">Kitöltések</span><b>Statisztika</b></div></div>
    <div class="stack">
      <div class="chips">${[['all','Mindkettő'],['ana','Anatómia'],['bm','Betegmegfigyelés']].map(([k,l])=>`<button class="chip" data-act="stsubj" data-s="${k}" aria-pressed="${statSubj===k}">${l}</button>`).join('')}</div>
      ${n?`
      <div class="tiles">${tile('Kitöltés',n)}${tile('Átlag',avg+'%')}${tile('Legjobb',best+'%')}${tile('Sikeres (≥41%)',pass+' / '+n)}${tile('Megoldott kérdés',totQ)}${tile('Összes idő',Math.floor(totSec/3600)?Math.floor(totSec/3600)+' ó '+Math.round(totSec%3600/60)+' p':Math.round(totSec/60)+' p')}</div>
      ${chart?`<section class="panel"><span class="eyebrow">Eredmények alakulása</span>${chart}</section>`:''}
      <section class="panel"><span class="eyebrow">Jegyek eloszlása</span><div class="topics">${GRADES.map(g=>g[1]).map(g=>{const c=gcount[g]||0;return`<div class="trow"><span>${g}</span><span class="num">${c}×</span><div class="bar2"><i style="width:${c/n*100}%"></i></div></div>`}).join('')}</div></section>
      ${tlist.length?`<section class="panel"><span class="eyebrow">Témakörök – leggyengébbtől</span><div class="topics">${tlist.map(a=>`<div class="trow"><span>${SUBJ[a.k].topics[a.t]}${statSubj==='all'?` <small class="muted">· ${SUBJ[a.k].short}</small>`:''}</span><span class="num">${Math.round(a.p/a.m*100)}%</span><div class="bar2"><i style="width:${a.p/a.m*100}%"></i></div></div>`).join('')}</div></section>`:''}
      <section class="panel"><span class="eyebrow">Összes kitöltés</span>
        <div class="tbl"><table><thead><tr><th>Időpont</th>${statSubj==='all'?'<th>Tárgy</th>':''}<th>Kérdés</th><th>Pont</th><th>%</th><th>Jegy</th><th>Idő</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${dt(r.d)}${r.retry?' <small class="muted">(hibák újra)</small>':''}</td>${statSubj==='all'?`<td><span class="sdot" style="background:var(--${r.k})"></span>${SUBJ[r.k].short}</td>`:''}<td class="num">${r.n}</td><td class="num">${r.pts}/${r.max}</td><td class="num"><b>${r.pct}</b></td><td>${gradeOf(r.pct).match(/\d/)[0]}</td><td class="num">${fmtTime(r.sec||0)}</td></tr>`).join('')}
        </tbody></table></div>
      </section>`:`<section class="panel"><p class="info">Még nincs befejezett vizsga ${statSubj==='all'?'':'ebből a tárgyból'}. Az első beadás után itt látod, hányszor, mikor és milyen eredménnyel töltötted ki.</p></section>`}
    </div></div>`;
}

// ---------- render + események ----------
let clockT=null;
function render(top){
  const app=$('#app');
  app.innerHTML=view==='stats'?statsView():view==='home'?homeView():view==='setup'?setupView():view==='quiz'?quizView():resultView();
  if(top)window.scrollTo(0,0);
  clearInterval(clockT);
  if(view==='quiz')clockT=setInterval(()=>{const c=$('#clock');if(c&&EX)c.textContent=fmtTime(Math.round((Date.now()-EX.start)/1000))},1000);
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
  const act=b.dataset.act, I=EX&&EX.items?EX.items[EX.cur]:null;
  switch(act){
    case'open':cfg={subj:b.dataset.k,len:cfg.len||20,topics:null};confirmReset=false;view='setup';render(true);break;
    case'home':view='home';confirmSubmit=false;render(true);break;
    case'topic':{const all=Object.keys(SUBJ[cfg.subj].topics);let s=new Set(cfg.topics||all);const t=b.dataset.t;s.has(t)?s.delete(t):s.add(t);if(!s.size)s=new Set(all);cfg.topics=s.size===all.length?null:[...s];render();break}
    case'len':cfg.len=b.dataset.l==='all'?'all':+b.dataset.l;render();break;
    case'start':startExam();break;
    case'resume':view='quiz';render(true);break;
    case'discard':EX=null;saveEx();render();break;
    case'reset':confirmReset=true;render();break;
    case'reset2':STORE={seen:{ana:[],bm:[]},hist:{ana:[],bm:[]}};persist();confirmReset=false;render();break;
    case'opt':{const i=+b.dataset.i;if(I.t==='s')I.ans=I.ans===i?null:i;else{const k=I.ans.indexOf(i);k>=0?I.ans.splice(k,1):I.ans.push(i)}confirmSubmit=false;saveEx();render();break}
    case'tf':{const v=b.dataset.v==='1';I.ans=I.ans===v?null:v;confirmSubmit=false;saveEx();render();break}
    case'ordadd':I.ans.push(+b.dataset.ix);confirmSubmit=false;saveEx();render();break;
    case'ordrm':I.ans.splice(+b.dataset.p,1);saveEx();render();break;
    case'cls':{const i=+b.dataset.i,g=+b.dataset.g;I.ans[i]=I.ans[i]===g?null:g;confirmSubmit=false;saveEx();render();break}
    case'goto':EX.cur=+b.dataset.i;confirmSubmit=false;saveEx();render(true);break;
    case'next':if(EX.cur<EX.items.length-1){EX.cur++;saveEx();render(true)}break;
    case'prev':if(EX.cur>0){EX.cur--;confirmSubmit=false;saveEx();render(true)}break;
    case'submit':confirmSubmit=true;render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});break;
    case'cancelsub':confirmSubmit=false;render();break;
    case'submit2':submitExam();break;
    case'filter':rvFilter=b.dataset.f;render();break;
    case'retry':{const ids=EX.items.filter(I=>scoreOf(I)<I.max).map(I=>I.id);cfg={...EX.cfg};startExam(ids);break}
    case'stats':view='stats';render(true);break;
    case'stsubj':statSubj=b.dataset.s;render();break;
    case'again':cfg={...EX.cfg};view='setup';render(true);break;
  }
});
document.addEventListener('change',ev=>{
  const s=ev.target.closest('select[data-act="ma"]');if(!s||!EX)return;
  const I=EX.items[EX.cur];I.ans[+s.dataset.i]=s.value;s.classList.toggle('set',!!s.value);confirmSubmit=false;saveEx();
  const p=$('.prog i');if(p)p.style.width=(EX.items.filter(touched).length/EX.items.length*100)+'%';
  const d=document.querySelector(`.dots button[data-i="${EX.cur}"]`);if(d)d.classList.toggle('done',touched(I));
});
if(EX&&EX.done){view='home'}
render();

</script>

</body>
